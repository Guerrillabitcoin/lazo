<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>LaZoo · Escanear</title>
<style>
  html, body { margin: 0; height: 100%; background: #141210; color: #f3eee6; font-family: system-ui, sans-serif; }
  main { display: flex; flex-direction: column; height: 100%; }
  header { padding: 14px 16px 6px; }
  .brand { font-family: Georgia, serif; font-style: italic; font-size: 34px; margin: 0; }
  .brand b { color: #e07a3d; font-weight: inherit; }
  #view { position: relative; flex: 1; margin: 8px 16px; border-radius: 16px; overflow: hidden; background: #000; }
  video { width: 100%; height: 100%; object-fit: cover; }
  .frame { position: absolute; inset: 18%; border: 3px solid #e07a3d; border-radius: 18px; box-shadow: 0 0 0 9999px rgba(0,0,0,0.35); }
  #msg { padding: 4px 16px; min-height: 2.6em; color: #c4b8aa; }
  .row { display: flex; gap: 8px; padding: 0 16px 16px; flex-wrap: wrap; }
  button, input { font: inherit; border-radius: 12px; border: 0; min-height: 48px; padding: 0 14px; }
  button { background: #3a332b; color: #f3eee6; flex: 1; }
  button.primary { background: #e07a3d; color: #141210; }
  input { flex: 2; background: #241f1a; color: #fff; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header><p class="brand">LaZ<b>oo</b></p></header>
  <div id="view"><video id="cam" playsinline muted></video><div class="frame"></div></div>
  <p id="msg" aria-live="polite">Apunta al QR que sale en la ventana de LaZoo del PC.</p>
  <div class="row">
    <button id="last" class="primary" type="button" hidden>Volver al último PC</button>
    <button id="retry" type="button">Reintentar cámara</button>
  </div>
  <div class="row">
    <input id="manual" inputmode="url" placeholder="o escribe http://192.168.1.x:8787" />
    <button id="go" type="button">Ir</button>
  </div>
</main>
<script src="jsqr.js"></script>
<script>
  const app = window.LaZooApp;
  const msg = (t) => { document.querySelector("#msg").textContent = t; };

  // Solo red local: 10/8, 172.16/12, 192.168/16, 169.254/16, 127/8, fc00::/7, fe80::/10.
  function privateHost(host) {
    host = (host || "").replace(/^\[|\]$/g, "").toLowerCase();
    const m = host.match(/^(\d+)\.(\d+)\.(\d+)\.(\d+)$/);
    if (m) {
      const [a, b] = [Number(m[1]), Number(m[2])];
      return a === 10 || a === 127 || (a === 172 && b >= 16 && b <= 31) || (a === 192 && b === 168) || (a === 169 && b === 254);
    }
    return /^(f[cd][0-9a-f]{2}|fe[89ab][0-9a-f]):/.test(host) || host === "::1";
  }

  function tryOpen(text) {
    let url;
    try { url = new URL(text.trim()); } catch (_e) { return false; }
    if (!/^https?:$/.test(url.protocol)) return false;
    if (!privateHost(url.hostname)) { msg("Ese QR no es de un PC de tu red local. No lo abro."); return false; }
    msg("Conectando con " + url.host + "…");
    if (app) return app.open(url.href);
    location.href = url.href;
    return true;
  }

  let stream = null, busy = false;
  const video = document.querySelector("#cam");
  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d", { willReadFrequently: true });

  async function start() {
    try {
      if (stream) stream.getTracks().forEach((t) => t.stop());
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
      video.srcObject = stream;
      await video.play();
      msg("Apunta al QR que sale en la ventana de LaZoo del PC.");
      requestAnimationFrame(tick);
    } catch (err) {
      msg("No puedo usar la cámara. Da permiso a LaZoo en Ajustes, o escribe la dirección abajo.");
    }
  }

  function tick() {
    if (busy || !stream) return;
    if (video.readyState >= 2 && video.videoWidth) {
      const w = 480, h = Math.round(480 * video.videoHeight / video.videoWidth);
      canvas.width = w; canvas.height = h;
      ctx.drawImage(video, 0, 0, w, h);
      const code = jsQR(ctx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: "dontInvert" });
      if (code && code.data && tryOpen(code.data)) {
        busy = true;
        stream.getTracks().forEach((t) => t.stop());
        return;
      }
    }
    setTimeout(() => requestAnimationFrame(tick), 120);
  }

  const last = app ? app.last() : "";
  if (last) {
    const b = document.querySelector("#last");
    b.hidden = false;
    try { b.textContent = "Volver a " + new URL(last).host; } catch (_e) {}
    b.addEventListener("click", () => tryOpen(last));
  }
  document.querySelector("#retry").addEventListener("click", () => { busy = false; start(); });
  document.querySelector("#go").addEventListener("click", () => {
    let t = document.querySelector("#manual").value.trim();
    if (t && !/^https?:\/\//.test(t)) t = "http://" + t;
    if (!tryOpen(t)) msg("Dirección no válida o fuera de tu red local.");
  });
  start();
</script>
</body>
</html>
