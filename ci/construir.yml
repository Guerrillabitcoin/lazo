# LaZoo: construye LaZoo.exe (Windows) y LaZoo.apk (Android).
# Se lanza al subir una etiqueta v* (por ejemplo v0.58.0) o a mano desde la pestaña Actions.
#
# 0.58: firmas OPCIONALES (guía: docs/FIRMAS.md, secretos: firmas/preparar_secretos.md).
#  - Sin ningún secreto se comporta como antes: APK con clave de PRUEBAS y .exe sin firmar.
#  - ANDROID_KEYSTORE_B64 + ANDROID_KEYSTORE_PASSWORD (+ ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD):
#    la APK sale con la clave de LANZAMIENTO.
#  - PGP_PRIVATE_KEY (+ PGP_PASSPHRASE): firma separada .asc de SHA256SUMS y de cada archivo.
#  - Siempre en etiquetas v*: SHA256SUMS, atestación de GitHub y Release (prerelease en 0.x).
#  - SignPath (.exe): hueco comentado en el trabajo «exe», ver docs/FIRMAS.md.
# Este archivo vive en ci/. Para activarlo hay que copiarlo a .github/workflows/construir.yml.
name: Construir LaZoo

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exe:
    name: LaZoo.exe (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Número de versión (VERSION.txt)
        shell: bash
        run: |
          VER="$(tr -d '\r\n' < VERSION.txt)"
          [[ "$VER" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "::error::VERSION.txt no tiene un número válido: '$VER'"; exit 1; }
          echo "VER=$VER" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PyInstaller (igual que construir_exe.bat)
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pyinstaller==6.22.3 -r requirements.txt
          pyinstaller --noconfirm --clean --noconsole --onedir --name LaZoo `
            --icon static\lazoo.ico `
            --add-data "static;static" --add-data "VERSION.txt;." --add-data "medios.ps1;." `
            --add-data "permitir.ps1;." --add-data "about.example.json;." `
            --distpath dist --workpath build LaZoo.pyw
          if (-not (Test-Path dist\LaZoo\LaZoo.exe)) { throw "No salió LaZoo.exe" }
      # --- SignPath (desactivado). Para activarlo (cuando SignPath Foundation apruebe el proyecto):
      # 1) Crea el secreto SIGNPATH_API_TOKEN y las variables del repo SIGNPATH_ORGANIZATION_ID,
      #    SIGNPATH_PROJECT_SLUG y SIGNPATH_POLICY_SLUG (los da SignPath).
      # 2) Descomenta los dos pasos y añade al trabajo:  permissions: { contents: read, actions: read }
      # 3) Cambia la subida de abajo para que use dist/LaZoo-firmado en vez de dist/LaZoo.
      # - id: sin-firmar
      #   uses: actions/upload-artifact@v4
      #   with: { name: LaZoo-windows-sin-firmar, path: dist/LaZoo }
      # - uses: signpath/github-action-submit-signing-request@v1
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      #     project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
      #     signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
      #     github-artifact-id: ${{ steps.sin-firmar.outputs.artifact-id }}
      #     wait-for-completion: true
      #     output-artifact-directory: dist/LaZoo-firmado
      - uses: actions/upload-artifact@v4
        with:
          name: LaZoo-${{ env.VER }}-windows
          path: dist/LaZoo
          retention-days: 30

  apk:
    name: LaZoo.apk (Android)
    runs-on: ubuntu-24.04
    env:
      HAY_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_B64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Número de versión (VERSION.txt y App N del AndroidManifest)
        run: |
          VER="$(tr -d '\r\n' < VERSION.txt)"
          APP="$(sed -n 's/.*android:versionName="\([^"]*\)".*/\1/p' android/AndroidManifest.xml)"
          [[ "$VER" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "::error::VERSION.txt no tiene un número válido: '$VER'"; exit 1; }
          [[ "$APP" =~ ^[0-9]+$ ]] || { echo "::error::android:versionName no es un número de App: '$APP'"; exit 1; }
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "APP=$APP" >> "$GITHUB_ENV"
      - name: Android SDK (platform 34, build-tools 34.0.0)
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "platforms;android-34" "build-tools;34.0.0" >/dev/null
          echo "ANDROID_SDK=$SDK" >> "$GITHUB_ENV"
      - name: Restaurar keystore de lanzamiento (solo si existe el secreto)
        if: env.HAY_KEYSTORE == 'true'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          umask 077
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/lazoo-lanzamiento.jks"
          echo "LAZOO_FIRMA_KS=$RUNNER_TEMP/lazoo-lanzamiento.jks" >> "$GITHUB_ENV"
      - name: Construir
        env:
          LAZOO_KEYSTORE: ${{ runner.temp }}/lazoo-pruebas.jks
          LAZOO_FIRMA_KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LAZOO_FIRMA_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          LAZOO_FIRMA_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          [ -n "$LAZOO_FIRMA_ALIAS" ] || unset LAZOO_FIRMA_ALIAS
          [ -n "$LAZOO_FIRMA_KEY_PASS" ] || unset LAZOO_FIRMA_KEY_PASS
          chmod +x android/construir_apk.sh
          android/construir_apk.sh "$PWD/LaZoo-App-$APP.apk"
          if [ "$HAY_KEYSTORE" = "true" ]; then echo "lanzamiento" > firma-apk.txt
          else echo "pruebas (sin firma de lanzamiento)" > firma-apk.txt; echo "::warning::APK sin firma de lanzamiento (falta ANDROID_KEYSTORE_B64)"; fi
      - name: Borrar keystore del runner
        if: always()
        run: rm -f "$RUNNER_TEMP/lazoo-lanzamiento.jks" "$RUNNER_TEMP/lazoo-pruebas.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: LaZoo-${{ env.VER }}-android-App-${{ env.APP }}
          path: |
            LaZoo-App-${{ env.APP }}.apk
            firma-apk.txt
          retention-days: 30

  linux:
    # 0.67: paquete de Linux. No es un binario: usa el Python y las librerías gráficas del
    # sistema (la bandeja necesita las del propio escritorio). Va con instalar-linux.sh.
    name: LaZoo para Linux (.tar.gz)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Número de versión (VERSION.txt)
        run: |
          VER="$(tr -d '\r\n' < VERSION.txt)"
          [[ "$VER" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "::error::VERSION.txt no tiene un número válido: '$VER'"; exit 1; }
          echo "VER=$VER" >> "$GITHUB_ENV"
      - name: Comprobar que arranca
        run: |
          sh -n iniciar.sh && sh -n instalar-linux.sh
          python3 -m py_compile lazo.py control.py bandeja.py bandeja_linux.py despierto.py historial.py mando.py pcapc.py linux_kvm.py
          python3 bandeja_linux.py --diagnostico || true
      - name: Empaquetar
        run: |
          mkdir -p salida
          git archive --format=tar.gz --prefix="LaZoo-$VER/" -o "salida/LaZoo-$VER-linux.tar.gz" HEAD
          tar tzf "salida/LaZoo-$VER-linux.tar.gz" | grep -q "LaZoo-$VER/instalar-linux.sh"
      - uses: actions/upload-artifact@v4
        with:
          name: LaZoo-${{ env.VER }}-linux
          path: salida/LaZoo-${{ env.VER }}-linux.tar.gz
          retention-days: 30

  publicar:
    name: SHA256SUMS, firmas y Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [exe, apk, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write      # crear la Release
      id-token: write      # atestación (Sigstore)
      attestations: write  # atestación
    env:
      HAY_PGP: ${{ secrets.PGP_PRIVATE_KEY != '' }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artefactos
      - name: Empaquetar
        run: |
          VER="$(tr -d '\r\n' < VERSION.txt)"
          APP="$(sed -n 's/.*android:versionName="\([^"]*\)".*/\1/p' android/AndroidManifest.xml)"
          # La etiqueta tiene que ser la misma versión que VERSION.txt (v0.64.0 <-> 0.64).
          case "$TAG" in "v$VER" | "v$VER".*) ;; *) echo "::error::La etiqueta $TAG no coincide con VERSION.txt ($VER)"; exit 1 ;; esac
          echo "VER=$VER" >> "$GITHUB_ENV"
          mkdir -p salida
          WIN="artefactos/LaZoo-$VER-windows"
          AND="artefactos/LaZoo-$VER-android-App-$APP"
          [ -f "$WIN/LaZoo.exe" ] || { echo "::error::Falta $WIN/LaZoo.exe"; exit 1; }
          [ -f "$AND/LaZoo-App-$APP.apk" ] || { echo "::error::Falta $AND/LaZoo-App-$APP.apk"; exit 1; }
          (cd "$WIN" && zip -qr -X "../../salida/LaZoo-$VER-windows.zip" .)
          cp "$AND/LaZoo-App-$APP.apk" "salida/LaZoo-App-$APP.apk"
          LIN="artefactos/LaZoo-$VER-linux/LaZoo-$VER-linux.tar.gz"
          [ -f "$LIN" ] || { echo "::error::Falta $LIN"; exit 1; }
          cp "$LIN" salida/
          echo "FIRMA_APK=$(cat "$AND/firma-apk.txt")" >> "$GITHUB_ENV"
          git archive --format=zip --prefix="LaZoo-$VER/" -o "salida/LaZoo-$VER.zip" "$TAG"
          cd salida && sha256sum LaZoo-* > SHA256SUMS && cat SHA256SUMS
      - name: Firma PGP (solo si existe el secreto)
        if: env.HAY_PGP == 'true'
        env:
          PGP_PRIVATE_KEY: ${{ secrets.PGP_PRIVATE_KEY }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 -p "$GNUPGHOME"
          printf '%s\n' "$PGP_PRIVATE_KEY" | gpg --batch --quiet --import
          cd salida
          for f in SHA256SUMS LaZoo-*; do
            printf '%s' "$PGP_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
              --armor --detach-sign -o "$f.asc" "$f"
          done
          gpg --batch --verify SHA256SUMS.asc SHA256SUMS
      - name: Borrar clave PGP del runner
        if: always()
        run: rm -rf "$RUNNER_TEMP/gnupg"
      - name: Atestación de origen (GitHub)
        uses: actions/attest-build-provenance@v2
        continue-on-error: true
        with:
          subject-path: "salida/LaZoo-*"
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$VER" in 0.*) PRE="--prerelease" ;; *) PRE="" ;; esac
          if [ "$HAY_PGP" = "true" ]; then PGPTXT="SHA256SUMS y cada archivo llevan firma PGP (.asc) de GUERRILLA."
          else PGPTXT="Sin firma PGP en esta versión: comprueba solo SHA256SUMS y la atestación."; fi
          {
            echo "LaZoo $VER (rama beta)."
            echo
            echo "- APK: firma de $FIRMA_APK."
            echo "- .exe: sin firma de Windows (SmartScreen avisará)."
            echo "- Linux: descomprime LaZoo-$VER-linux.tar.gz y ejecuta sh instalar-linux.sh."
            echo "- $PGPTXT"
            echo "- Atestación: gh attestation verify ARCHIVO -R ${{ github.repository }}"
            echo
            echo "Cómo comprobar: docs/FIRMAS.md y firmas/verificar.sh / verificar.ps1."
          } > notas.md
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" $PRE --verify-tag --title "LaZoo $VER" --notes-file notas.md
          gh release upload "$TAG" salida/* --clobber
