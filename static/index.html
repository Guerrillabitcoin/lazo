<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>LaZoo 0.31</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <main class="phone">
      <header id="status" class="top" data-link="off">
        <div class="brand-col">
          <div class="brand" aria-hidden="true"><span>LaZ</span><span class="oo"><span class="o">o</span><span class="bridge"></span><span class="o right">o</span></span></div>
          <p class="ver">0.31</p>
        </div>
        <div class="status-copy">
          <p id="link-label">Sin conexión</p>
          <p id="visor" class="visor"></p>
        </div>
      </header>

      <section id="pin" class="panel pin" hidden>
        <input id="pin-input" inputmode="numeric" autocomplete="one-time-code" maxlength="4" placeholder="PIN" />
        <button id="pin-go" type="button" class="primary">Entrar</button>
      </section>

      <section id="app" class="app" hidden>
        <div id="stage">
        <div id="view-mouse" class="view">
          <article class="deck">
            <div class="cursor-row" role="group" aria-label="Tamaño del cursor">
              <button type="button" data-cursor="normal" class="on">Normal</button>
              <button type="button" data-cursor="large">Grande</button>
              <button type="button" data-cursor="huge">Enorme</button>
            </div>
            <div id="pad" class="pad" role="application" aria-label="Trackpad"><canvas id="trail"></canvas><span id="finger" hidden></span></div>
            <div class="split three">
              <button id="btn-left" type="button">Clic</button>
              <button id="btn-type" type="button">Teclado</button>
              <button id="btn-right" type="button">Clic derecho</button>
            </div>
            <input id="native-type" class="native-type" inputmode="text" autocomplete="off" autocapitalize="sentences" enterkeyhint="done" aria-label="Teclado del móvil" />
            <button id="caret-write" type="button" hidden>Escribir</button>
            <div id="keys" hidden></div>
          </article>
        </div>

        <div id="view-windows" class="view" hidden>
          <article class="deck">
            <div class="row-actions">
              <button id="win-refresh" type="button">Actualizar</button>
            </div>
            <ul id="windows" class="list"></ul>
            <div id="win-actions" class="win-actions" hidden>
              <button type="button" data-win="focus">Al frente</button>
              <button type="button" data-win="minimize">Minimizar</button>
              <button type="button" data-win="maximize">Maximizar</button>
              <button type="button" data-win="snap_left">Izquierda</button>
              <button type="button" data-win="snap_right">Derecha</button>
              <button type="button" data-win="close" class="danger">Cerrar</button>
            </div>
          </article>
        </div>

        <div id="view-youtube" class="view" hidden>
          <article class="deck">
            <p id="yt-title" class="now">YouTube</p>
            <div class="transport">
              <button type="button" data-yt="prev">Anterior</button>
              <button id="yt-play" type="button" data-yt="play" class="primary">Play</button>
              <button type="button" data-yt="next">Siguiente</button>
            </div>
            <div class="split">
              <button type="button" data-yt="back">−10 s</button>
              <button type="button" data-yt="forward">+10 s</button>
            </div>
            <div class="vol-line">
              <input id="yt-vol" type="range" min="0" max="100" value="50" aria-label="Volumen de YouTube" />
              <span id="yt-level">50</span>
              <button id="yt-mute" type="button" data-yt="mute" class="icon" aria-label="Silencio">
                <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path class="wave" d="M16 9a5 5 0 0 1 0 6M18.5 7a8 8 0 0 1 0 10" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
              </button>
            </div>
            <div class="vol-line">
              <input id="yt-speed" type="range" min="0" max="3" step="1" value="0" aria-label="Velocidad" />
              <span id="yt-speed-label">1.0</span>
            </div>
            <div class="tools">
              <button type="button" data-yt="home">Inicio</button>
              <button type="button" data-yt="full">Pantalla</button>
              <button type="button" data-yt="theater">Cine</button>
              <button type="button" data-yt="captions">Subtítulos</button>
            </div>
            <form id="yt-search" class="phrase">
              <input id="yt-q" maxlength="120" placeholder="Buscar" />
              <button type="submit">Buscar</button>
            </form>
            <ul id="yt-results" class="list"></ul>
          </article>
        </div>

        <div id="view-spotify" class="view" hidden>
          <article class="deck">
            <p id="sp-title" class="now">Spotify</p>
            <div class="transport">
              <button type="button" data-sp="prev">Anterior</button>
              <button id="sp-play" type="button" data-sp="play" class="primary">Play</button>
              <button type="button" data-sp="next">Siguiente</button>
            </div>
            <div class="vol-line">
              <input id="sp-vol" type="range" min="0" max="100" value="50" aria-label="Volumen de Spotify" />
              <span id="sp-level">50</span>
              <button id="sp-mute" type="button" data-sp="mute" class="icon" aria-label="Silencio">
                <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path class="wave" d="M16 9a5 5 0 0 1 0 6M18.5 7a8 8 0 0 1 0 10" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
              </button>
            </div>
            <form id="sp-search" class="phrase">
              <input id="sp-q" maxlength="120" placeholder="Buscar" />
              <button type="submit">Buscar</button>
            </form>
          </article>
        </div>

        <div id="view-bridge" class="view" hidden>
          <article class="deck">
            <div class="photo-actions">
              <label class="file-label">Fotos y vídeos<input id="photo-input" type="file" accept="image/*,video/*" multiple hidden /></label>
              <label class="file-label">Carpeta del móvil<input id="photo-dir" type="file" accept="image/*,video/*" webkitdirectory multiple hidden /></label>
              <label class="file-label">Enviar archivo<input id="file-input" type="file" hidden /></label>
            </div>
            <div id="xfer" class="xfer" hidden>
              <div class="xfer-track"><div id="xfer-bar"></div></div>
              <p id="xfer-stat" class="hint"></p>
            </div>
            <p id="photo-progress" class="hint"></p>
            <ul id="files" class="list"></ul>
          </article>
        </div>

        <div id="view-notes" class="view" hidden>
          <article class="deck">
            <form id="clip-form" class="phrase">
              <textarea id="clip-input" rows="3" maxlength="8000" placeholder="Nota"></textarea>
              <button type="submit">Guardar</button>
            </form>
            <ul id="clips" class="list"></ul>
          </article>
        </div>

        <div id="view-volume" class="view" hidden>
          <article class="deck">
            <div class="vol" aria-label="Volumen del sistema">
              <button id="vol-down" type="button">Bajar</button>
              <button id="vol-mute" type="button">Mute</button>
              <button id="vol-up" type="button">Subir</button>
            </div>
          </article>
        </div>

        <div id="view-lab" class="view" hidden>
          <article class="deck">
            <p class="now">Spotify en prueba</p>
            <div class="split">
              <button id="lab-like" type="button">Me gusta</button>
              <button id="lab-queue" type="button">Leer próximas</button>
            </div>
            <button id="lab-add" type="button">Sumar la que suena</button>
            <ul id="lab-tracks" class="list"></ul>
          </article>
          <article class="deck">
            <p class="now">PC en prueba</p>
            <div class="split">
              <button id="lab-lock" type="button">Bloquear</button>
              <button id="lab-screen" type="button">Apagar pantalla</button>
            </div>
          </article>
          <article class="deck">
            <p class="now">Atajos en prueba</p>
            <div class="tools">
              <button type="button" data-lab="desktop">Escritorio</button>
              <button type="button" data-lab="alttab">Cambiar</button>
              <button type="button" data-lab="back">Atrás</button>
              <button type="button" data-lab="forward">Adelante</button>
              <button type="button" data-lab="copy">Copiar</button>
              <button type="button" data-lab="paste">Pegar</button>
              <button type="button" data-lab="undo">Deshacer</button>
              <button type="button" data-lab="close">Cerrar</button>
              <button type="button" data-lab="middle">Clic central</button>
              <button type="button" data-lab="zoomin">Zoom +</button>
              <button type="button" data-lab="zoomout">Zoom −</button>
            </div>
          </article>
          <article class="deck">
            <p class="now">Sistema en prueba</p>
            <div class="tools">
              <button type="button" data-lab="shot">Captura</button>
              <button type="button" data-lab="bright_down">Brillo −</button>
              <button type="button" data-lab="bright_up">Brillo +</button>
              <button type="button" data-lab="battery">Batería</button>
              <button type="button" data-lab="front">Ventana activa</button>
              <button type="button" data-lab="sleep">Suspender</button>
            </div>
            <form id="lab-open" class="phrase">
              <input id="lab-url" maxlength="200" placeholder="Abrir en el PC" />
              <button type="submit">Abrir</button>
            </form>
          </article>
        </div>
        </div>
        <nav id="dock" class="dock" hidden aria-label="Herramientas"></nav>
      </section>
    </main>
    <script src="/seal.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
